roles = ["frontend"]

[commands]
# $SHOPIFY_API_KEY e $PORT sono iniettati da `shopify app dev`.
# Passare il client_id della config attiva ad App Bridge garantisce che l'api-key
# combaci sempre con l'app (dev o prod) selezionata, indipendentemente da .env.
dev = "VITE_SHOPIFY_API_KEY=$SHOPIFY_API_KEY npm run dev -- --port $PORT"
